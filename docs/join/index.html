<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convite — ChatRoom</title>
  <style>
    :root { --bg:#F8FAFC; --card:#FFFFFF; --text:#0F172A; --muted:#566579; --border:#E2E8F0; --primary:#2563EB; --on-primary:#FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0B1220; --card:#131C2E; --text:#F1F5F9; --muted:#9AA9BD; --border:#26324A; }
    }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; box-sizing:border-box;
           background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:32px; text-align:center; }
    h1 { margin:0 0 8px; font-size:24px; }
    p { margin:0 0 24px; color:var(--muted); line-height:1.5; }
    a.button { display:inline-block; background:var(--primary); color:var(--on-primary); text-decoration:none; font-weight:700; padding:14px 28px; border-radius:999px; }
    small { display:block; margin-top:24px; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Convite para o ChatRoom</h1>
    <p id="message">Abrindo o aplicativo…</p>
    <a id="open" class="button" href="#" hidden>Abrir no ChatRoom</a>
    <small id="hint" hidden>Se nada acontecer, instale o app ChatRoom e toque no link do e-mail de novo.</small>
  </main>
  <script>
    // Link do e-mail: .../join/?t=<token>  →  abre chatroom://join/<token>
    var token = new URLSearchParams(location.search).get('t');
    var valid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token || '');
    var $ = function (id) { return document.getElementById(id); };
    if (!valid) {
      $('title').textContent = 'Convite inválido';
      $('message').textContent = 'Este link está incompleto. Peça um novo convite a quem convidou você.';
    } else {
      var target = 'chatroom://join/' + token;
      $('open').href = target;
      $('open').hidden = false;
      $('hint').hidden = false;
      $('message').textContent = 'Toque no botão para entrar na sala pelo aplicativo.';
      location.href = target;
    }
  </script>
</body>
</html>
